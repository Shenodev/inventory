; Vercel PHP runtime overrides.
;
; vercel-php appends this file to its own php.ini before starting php-cgi.
;
; The rewrites in vercel.json send every request to /api/index.php, but php-cgi
; keeps the original REQUEST_URI. With cgi.fix_pathinfo=1 (the default) php-cgi
; notices that the request path starts with /api, which is the directory holding
; the entrypoint, and therefore reports SCRIPT_NAME=/api/index.php with
; PATH_INFO=/dashboard. Symfony then treats /api as the front controller's base
; URL and strips it, so Laravel matches /dashboard and returns 404 for every
; real API route. Disabling the fix keeps SCRIPT_NAME on the entrypoint and
; hands Laravel the untouched path.
cgi.fix_pathinfo=0

; Never let notices, warnings or deprecation output leak into an API response,
; and keep errors going to stderr where the Vercel function logs can see them.
display_errors=Off
log_errors=On
